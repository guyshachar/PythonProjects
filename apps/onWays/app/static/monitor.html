<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnWays Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.3px;
    }

    header h1 span { color: #38bdf8; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #last-updated { font-size: 0.78rem; color: #64748b; }

    button {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    button:hover { background: #334155; color: #e2e8f0; }
    button.danger { border-color: #7f1d1d; color: #fca5a5; }
    button.danger:hover { background: #7f1d1d; color: #fee2e2; }

    /* Summary cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px 20px;
    }

    .card .label { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 2rem; font-weight: 700; margin-top: 4px; color: #f1f5f9; }
    .card.banned .value { color: #f87171; }
    .card.conv .value { color: #34d399; }

    /* Sessions table */
    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead tr { background: #1e293b; }
    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      white-space: nowrap;
    }

    tbody tr { border-top: 1px solid #1e293b; transition: background 0.1s; }
    tbody tr:hover { background: #1e293b55; }
    tbody td { padding: 12px 16px; vertical-align: middle; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge.normal { background: #052e16; color: #4ade80; border: 1px solid #166534; }
    .badge.banned { background: #450a0a; color: #f87171; border: 1px solid #7f1d1d; }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 0.82rem; color: #94a3b8; }

    .actions { display: flex; gap: 8px; }

    .error-banner {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* API key modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: #0f172acc;
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px 32px;
      width: min(400px, 90vw);
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 8px; }
    .modal p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
    .modal input {
      width: 100%; background: #0f172a; border: 1px solid #475569;
      border-radius: 6px; padding: 10px 12px; color: #e2e8f0;
      font-size: 0.9rem; margin-bottom: 14px; outline: none;
    }
    .modal input:focus { border-color: #38bdf8; }
    .modal .row { display: flex; gap: 10px; justify-content: flex-end; }
  </style>
</head>
<body>

<!-- API key modal -->
<div class="modal-overlay" id="keyModal">
  <div class="modal">
    <h2>OnWays Monitor</h2>
    <p>Enter your Gateway API key to access the live dashboard. It will be saved in your browser session.</p>
    <input type="password" id="apiKeyInput" placeholder="X-Api-Key value" />
    <div class="row">
      <button onclick="saveKey()">Connect</button>
    </div>
  </div>
</div>

<header>
  <h1>On<span>Ways</span> Monitor</h1>
  <div class="header-right">
    <span id="last-updated"></span>
    <button onclick="refresh()"><span id="spinner" class="spinner" style="display:none"></span> Refresh</button>
    <button onclick="clearKey()">Change API Key</button>
  </div>
</header>

<div class="error-banner" id="errorBanner"></div>

<div class="cards">
  <div class="card">
    <div class="label">Sessions</div>
    <div class="value" id="statSessions">—</div>
  </div>
  <div class="card banned">
    <div class="label">Banned</div>
    <div class="value" id="statBanned">—</div>
  </div>
  <div class="card conv">
    <div class="label">Active Conv. Windows</div>
    <div class="value" id="statConv">—</div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Session / Client</th>
        <th>WAHA Session</th>
        <th>Meta Number</th>
        <th>State</th>
        <th>Banned At</th>
        <th>Recovery At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="sessionTable">
      <tr><td colspan="7" style="text-align:center;color:#475569;padding:32px">Loading…</td></tr>
    </tbody>
  </table>
</div>

<script>
  const API_BASE = window.location.origin;
  let refreshTimer = null;

  function getKey() { return sessionStorage.getItem("onways_api_key") || ""; }

  function saveKey() {
    const v = document.getElementById("apiKeyInput").value.trim();
    if (!v) return;
    sessionStorage.setItem("onways_api_key", v);
    document.getElementById("keyModal").style.display = "none";
    refresh();
    startAutoRefresh();
  }

  function clearKey() {
    sessionStorage.removeItem("onways_api_key");
    document.getElementById("keyModal").style.display = "flex";
    clearInterval(refreshTimer);
  }

  function fmt(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleString();
  }

  function showError(msg) {
    const b = document.getElementById("errorBanner");
    b.textContent = msg;
    b.style.display = "block";
  }

  function hideError() {
    document.getElementById("errorBanner").style.display = "none";
  }

  async function doAction(sessionId, action) {
    const key = getKey();
    try {
      await fetch(`${API_BASE}/v1/admin/state/${sessionId}/${action}`, {
        method: "POST",
        headers: { "X-Api-Key": key },
      });
      await refresh();
    } catch(e) {
      showError("Action failed: " + e.message);
    }
  }

  async function refresh() {
    const key = getKey();
    if (!key) return;

    const spinner = document.getElementById("spinner");
    spinner.style.display = "inline-block";

    try {
      const res = await fetch(`${API_BASE}/v1/admin/monitor`, {
        headers: { "X-Api-Key": key },
      });

      if (res.status === 401) {
        showError("Invalid API key – please update it.");
        clearKey();
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      hideError();

      document.getElementById("statSessions").textContent = data.total_sessions;
      document.getElementById("statBanned").textContent = data.total_banned;
      document.getElementById("statConv").textContent = data.active_conversations;
      document.getElementById("last-updated").textContent =
        "Updated " + new Date().toLocaleTimeString();

      const tbody = document.getElementById("sessionTable");
      if (!data.sessions || data.sessions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#475569;padding:32px">No sessions found.</td></tr>';
        return;
      }

      tbody.innerHTML = data.sessions.map(s => {
        const stateClass = s.state === "banned" ? "banned" : "normal";
        const stateLabel = s.state === "banned" ? "Banned" : "Normal";
        return `
          <tr>
            <td><strong>${s.session_id}</strong></td>
            <td class="mono">${s.waha_session || "—"}</td>
            <td class="mono">${s.meta_number || "—"}</td>
            <td><span class="badge ${stateClass}">${stateLabel}</span></td>
            <td class="mono" style="font-size:0.78rem">${fmt(s.banned_at)}</td>
            <td class="mono" style="font-size:0.78rem">${fmt(s.expires_at)}</td>
            <td>
              <div class="actions">
                ${s.state === "banned"
                  ? `<button onclick="doAction('${s.session_id}','reset')">Reset</button>`
                  : `<button class="danger" onclick="doAction('${s.session_id}','ban')">Force Ban</button>`
                }
              </div>
            </td>
          </tr>`;
      }).join("");

    } catch(e) {
      showError("Failed to fetch monitor data: " + e.message);
    } finally {
      spinner.style.display = "none";
    }
  }

  function startAutoRefresh() {
    clearInterval(refreshTimer);
    refreshTimer = setInterval(refresh, 10000);
  }

  // Init
  if (getKey()) {
    document.getElementById("keyModal").style.display = "none";
    refresh();
    startAutoRefresh();
  }

  document.getElementById("apiKeyInput").addEventListener("keydown", e => {
    if (e.key === "Enter") saveKey();
  });
</script>
</body>
</html>
