version: '3.8'
services:
  app:
    image: guyshacharacc/refportalmonitor:latest
    tty: true
    environment:
      - TZ=Asia/Jerusalem
      - logLevel=INFO
      - start_delay=60
      - monitor_interval=60
      - servicePrefix=refportalservice
    volumes:
      - /home/guy/refPortalService/data:/run/data
      - /var/run/docker.sock:/var/run/docker.sock  # Allow monitor to access Docker
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

