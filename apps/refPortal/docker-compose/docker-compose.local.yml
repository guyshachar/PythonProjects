# Local-only overlay: give the gateway boto3 credentials (DynamoDB, Secrets Manager, Bedrock, CloudWatch, S3).
# Production / Swarm usually uses an IAM task role — do not use this file there.
#
# Prerequisite: `aws configure` or AWS SSO on the host so ~/.aws exists.
#
#   cd docker-compose
#   docker compose -f docker-compose-srv.yml -f docker-compose.local.yml up gw
#
version: '3.8'
services:
  gw:
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-il-central-1}
      # Compose-srv sets PROXY_SERVER=socks5h://tailscale:1055; without a Tailscale container on the same
      # network Playwright will fail to connect. Default off for local Mac — set DISABLE_BROWSER_PROXY=0 and
      # run a reachable SOCKS proxy if www.football.org.il blocks your IP or headless automation (403).
      DISABLE_BROWSER_PROXY: "${DISABLE_BROWSER_PROXY:-1}"
    # Optional: enable via merged config FlareSolverr or USE_FLARESOLVERR=1 / FLARESOLVERR_URL=http://flaresolverr:8191

  # Cloudflare / challenge bypass — not started unless you pass --profile flaresolverr
  #   docker compose -f docker-compose-srv.yml -f docker-compose.local.yml --profile flaresolverr up gw flaresolverr
  # If cf_clearance is IP-bound, configure the same PROXY in FlareSolverr (see FlareSolverr env PROXY_URL).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    networks:
      - refereex_shared_net
    profiles:
      - flaresolverr
