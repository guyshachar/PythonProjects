[tool.poetry]
name = "many-chat-api-client"
version = "beta"
description = "A client library for accessing ManyChat API"
authors = []
readme = "README.md"
packages = [
    {include = "many_chat_api_client"},
]
include = ["CHANGELOG.md", "many_chat_api_client/py.typed"]


[tool.poetry.dependencies]
python = "^3.9"
httpx = ">=0.23.0,<0.29.0"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
