services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cheerapp
      POSTGRES_PASSWORD: cheerapp
      POSTGRES_DB: cheerapp
    ports:
      # 5433, not 5432 — avoids colliding with any other locally-running
      # Postgres (e.g. this monorepo's refPortal).
      - "5433:5432"
    volumes:
      - cheerapp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheerapp"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  cheerapp_pg_data:
